<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="local-token" content="__SESSION_TOKEN__"><meta name="local-store" content="__STORE_ID__"><title>经历记忆 · 本地工作台</title>
<link rel="stylesheet" href="/style.css"><script src="/operations.js" defer></script><script src="/app.js" defer></script></head>
<body>
<header><div><p class="eyebrow">本地工作台</p><h1>经历记忆</h1><p>从每一次讨论，回到有据可查的原话。</p></div><span class="badge">候选材料 · 探索结果</span></header>
<main>
<section class="panel"><div class="row"><h2>导入与处理</h2><span id="budget" class="muted"></span></div>
<p class="muted">转录和模型结果保存在本机。点击“生成经历”会向 OpenAI 官方接口发送转录，消耗你已授权的 ChatGPT 套餐用量；旧结果保留原模型版本。</p>
<p class="muted">支持UTF-8 TXT（先转为MD兼容转录）及原有MD，须保留时间和说话人。</p>
<div class="row"><input id="file" type="file" accept=".txt,.md" aria-label="选择TXT或MD转录文件"><input id="recording" placeholder="录音标识，默认文件名" aria-label="录音标识"><button id="import">导入转录</button></div>
<div id="sources"></div><details><summary>处理状态</summary><div id="jobs"></div></details></section>
<section class="panel"><div class="row"><h2>查找经历</h2><span id="count" class="muted"></span></div>
<div class="row"><input id="query" placeholder="搜索经历中的内容" aria-label="搜索内容"><select id="topic" aria-label="按主题筛选"><option value="">全部主题</option></select><button id="search">查询</button></div>
<div class="row selection"><span id="selected">已选 0 条</span><input id="purpose" placeholder="本次导出用途" aria-label="导出用途"><button id="export">固定范围并导出</button></div>
<div id="events" class="events"></div><div class="row"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div></section>
<section id="detail" class="panel" hidden></section>
<button id="check-operation" class="secondary">核对上次操作</button><p id="message" role="status" aria-live="polite"></p>
</main><footer>经历概括是带原文依据的解释。原文中的提议、条件和声称完成，不自动等同于已验证的现实事实。</footer>
</body></html>
